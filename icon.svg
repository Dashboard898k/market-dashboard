<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background (no radius — system applies shape for maskable) -->
  <rect width="512" height="512" fill="#000000"/>

  <!-- Candle 1: Bearish red, medium -->
  <line x1="124" y1="152" x2="124" y2="208" stroke="#f87171" stroke-width="14" stroke-linecap="round"/>
  <rect x="84" y="208" width="80" height="132" rx="8" fill="#f87171"/>
  <line x1="124" y1="340" x2="124" y2="384" stroke="#f87171" stroke-width="14" stroke-linecap="round"/>

  <!-- Candle 2: Bullish green, small -->
