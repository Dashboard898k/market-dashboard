  <rect x="216" y="244" width="80" height="88" rx="8" fill="#4ade80"/>
  <line x1="256" y1="332" x2="256" y2="374" stroke="#4ade80" stroke-width="14" stroke-linecap="round"/>

  <!-- Candle 3: Bullish green, large -->
  <line x1="388" y1="104" x2="388" y2="152" stroke="#4ade80" stroke-width="14" stroke-linecap="round"/>
  <rect x="348" y="152" width="80" height="176" rx="8" fill="#4ade80"/>
